<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mailchimp Embed Demo</title>

  <!-- 1) Mailchimp default stylesheet (must be first). This is hosted by Mailchimp. -->
  <link href="//cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet" type="text/css">

  <!-- 2) Your override stylesheet (must load after Mailchimp). In production, point this to your hosted file. -->
  <link href="../src/mailchimp-override.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div id="mc_embed_signup">
    <!-- The 'action' URL below is YOUR unique Mailchimp endpoint.
         Do not copy this exact URL. Replace with the one from your own Mailchimp embed.
         Anatomy:
           https://YOUR-DATA-CENTER.list-manage.com/subscribe/post
             ?u=YOUR_U_ID        <-- unique account identifier
             &id=YOUR_LIST_ID    <-- audience/list identifier
         Example data-center looks like 'us20', 'us21', etc. -->
    <form action="https://YOUR-DATA-CENTER.list-manage.com/subscribe/post?u=YOUR_U_ID&amp;id=YOUR_LIST_ID"
          method="post" target="_blank" novalidate>
      <div id="mc_embed_signup_scroll">
        <h2>Subscribe</h2>

        <div class="indicates-required">
          <span class="asterisk">*</span> indicates required
        </div>

        <div class="mc-field-group">
          <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
          <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" placeholder="you@example.com" required>
        </div>

        <div class="mc-field-group">
          <label for="mce-FNAME">First Name</label>
          <input type="text" name="FNAME" id="mce-FNAME" placeholder="Ada">
        </div>

        <div class="clear foot">
          <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Subscribe">
        </div>
      </div>

      <!-- Honeypot to reduce bot signups. Leave as-is. -->
      <div aria-hidden="true" style="position:absolute; left:-5000px;">
        <input type="text" name="b_YOUR_U_ID_YOUR_LIST_ID" tabindex="-1" value="">
      </div>
    </form>
  </div>

  <!-- Mailchimp validation script (optional but included in their embed). -->
  <script src="//s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"></script>
</body>
</html>
